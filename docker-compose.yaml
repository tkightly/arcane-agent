volumes:
  agent-data:

services:
  arcane-agent:
    container_name: "arcane-agent"
    image: "ghcr.io/getarcaneapp/agent:v2.17.3"
    restart: "unless-stopped"
    environment:
      # EDGE_AGENT=true is Edge/push mode: this agent dials out to
      # MANAGER_API_URL and negotiates a tunnel, matching an environment
      # created as "Edge" in the manager UI (API URL shown there as
      # edge://<name>). No inbound port needs to be open on this host.
      # Direct/pull mode (AGENT_MODE=true) is the opposite: the manager
      # dials in to this agent's :3553 instead, and MANAGER_API_URL is
      # unused. The two modes are not interchangeable - they must match
      # whatever the manager's environment record was created as.
      - "EDGE_AGENT=true"
      - "AGENT_TOKEN=${AGENT_TOKEN}"
      - "MANAGER_API_URL=${MANAGER_API_URL}"
    volumes:
      - "agent-data:/app/data"
      # Direct socket, no tecnativa/docker-socket-proxy in front. BuildKit
      # opens its build session with an HTTP "Upgrade: h2c" on /session,
      # which HAProxy (and so the proxy) answers with 400 even when
      # SESSION=1, so image builds can't work through it. The proxy also
      # added little: with CONTAINERS+POST the agent could already start a
      # privileged container with the host filesystem mounted, which is
      # root on the host either way.
      - "/var/run/docker.sock:/var/run/docker.sock"
