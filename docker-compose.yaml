name: arcane-agent

# Arcane Edge agent: dials out to the manager, so no inbound port is
# needed on this host. See README.md.

volumes:
  agent-data:
    name: "arcane-agent-data"

services:
  arcane-agent:
    container_name: "arcane-agent"
    image: "ghcr.io/getarcaneapp/agent:v2.17.3"
    restart: "unless-stopped"
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=UTC"
      - "EDGE_AGENT=true"
      - "AGENT_TOKEN=${AGENT_TOKEN:?set AGENT_TOKEN in .env}"
      - "MANAGER_API_URL=${MANAGER_API_URL:-https://arcane.internal.taucetifive.com:9553}"
    volumes:
      # Direct socket rather than a socket proxy: the agent must be able to
      # create containers, which is already full control of the host, so a
      # proxy only blocks extras like exec while adding a moving part.
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "agent-data:/app/data"
      # Projects are checked out on the host so their files are easy to
      # reach. Arcane maps relative bind mounts through this mount.
      - "${PROJECTS_PATH:-/opt/stacks}:/app/data/projects"
